Server:
  # 控制面与管理后台共用这一个端口。agent 的 --controller-addr 指向它。
  Port: 8123
  NodeRole: Controller
  LogLevel: 2 # 0=trace 1=debug 2=info 3=notice 4=warn 5=error
  # 决定 user_daily_traffic 的日期归属，不只是日志时间戳。
  Timezone: Asia/Shanghai
  # 后台任务的执行间隔（秒）。
  WorkerIntervalSeconds: 30
  # agent 回连的对外地址，控制台生成安装命令时填进 `-a`。留空则按本次请求的
  # Host 加上面的 Port 推测——单机部署够用，前面挡了 nginx/Ingress 就要显式配。
  # ControllerAddr: controller.example.com:8123
  # 安装命令 curl 的脚本地址。留空用 GitHub 上发布的 scripts/install.sh。
  # InstallScriptURL: https://mirror.internal/stander/install.sh
EnableRelay: False
Database:
  Username: root
  # 生产请用 STANDER_DATABASE_PASSWORD 注入，不要写在文件里。
  Password: change-me
  DBName: stander
  Addr: 127.0.0.1:3306
Admin:
  # 生产请用 STANDER_ADMIN_JWTSIGNINGKEY 注入。
  JWTSigningKey: change-me
