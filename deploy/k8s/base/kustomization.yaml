apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - server-deployment.yaml
  - server-service.yaml
  - worker-deployment.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: stander
      app.kubernetes.io/part-of: stander

images:
  - name: stander
    newTag: 0.1.0
