apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - server-deployment.yaml
  - server-service.yaml
  - worker-deployment.yaml
  - web-deployment.yaml
  - web-service.yaml

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: stander
      app.kubernetes.io/part-of: stander

# Two images, bumped together. CI rewrites both tags with the commit SHA it
# built; see docs/cicd.md.
images:
  - name: stander
    newTag: 0.1.0
  - name: stander-web
    newTag: 0.1.0
