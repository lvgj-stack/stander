apiVersion: apps/v1
kind: Deployment
metadata:
  name: stander-worker
spec:
  # Must stay at 1. Two workers would both roll users' traffic periods forward.
  replicas: 1
  # Recreate, not RollingUpdate: a rolling update would briefly run two
  # workers at once, which is exactly what replicas:1 is protecting against.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: stander
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stander
          image: stander
          args: ["worker"]
          ports:
            - name: http
              containerPort: 8123
          envFrom:
            - configMapRef:
                name: stander-config
            - secretRef:
                name: stander-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
