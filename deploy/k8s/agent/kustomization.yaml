apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Deploy this only if a forwarding node lives inside the cluster. Most agents
# run on standalone VPSes and are installed with scripts/install.sh instead —
# see docs/deployment.md for why this is not a DaemonSet.
resources:
  - agent-deployment.yaml

# Pulled from a registry, unlike the dev overlay's side-loaded images. Change
# the owner when deploying a fork.
images:
  - name: stander
    newName: ghcr.io/lvgj-stack/stander
    newTag: 0.0.1-alpha.1
