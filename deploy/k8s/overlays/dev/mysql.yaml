# A throwaway MySQL for local clusters (kind, minikube, k3s). Do not use this
# in production: it has no backups and emptyDir storage.
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app.kubernetes.io/component: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: stander
            - name: MYSQL_DATABASE
              value: stander
            - name: MYSQL_USER
              value: stander
            - name: MYSQL_PASSWORD
              value: stander
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: initdb
          configMap:
            name: stander-schema
        - name: data
          emptyDir: {}
