apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: stander

resources:
  - ../../base
  - namespace.yaml
  - ingress.yaml
  - hpa.yaml
  - pdb.yaml

patches:
  - path: replicas.yaml
    target:
      kind: Deployment
      name: stander-server
  - path: replicas.yaml
    target:
      kind: Deployment
      name: stander-web

configMapGenerator:
  - name: stander-config
    behavior: merge
    literals:
      - STANDER_DATABASE_ADDR=mysql.stander.svc.cluster.local:3306
      # Must match how agents actually reach /api/v1 — the Ingress host here,
      # or a direct address if they bypass it. The console's install command is
      # only copy-pasteable if this is right. See the base ConfigMap.
      - STANDER_SERVER_CONTROLLERADDR=stander.example.com:80

generatorOptions:
  disableNameSuffixHash: true

# The Secret is NOT generated here. Create it out of band so credentials never
# land in git:
#   kubectl -n stander create secret generic stander-secrets \
#     --from-literal=STANDER_DATABASE_PASSWORD=... \
#     --from-literal=STANDER_ADMIN_JWTSIGNINGKEY=...

# What prod is running. This block is the record of it: nothing rewrites it at
# deploy time, so what is in git is what is on the cluster. Bumping a version
# means editing these two tags and applying — see docs/deployment.md.
#
# The registry lives here and not in base because base is also what the dev
# overlay builds on, and dev's images are side-loaded into kind under their bare
# names by scripts/e2e-kind.sh. A newName in base would send that lookup to a
# registry the kind node cannot reach.
#
# Change the owner when deploying a fork; it is not derived from anything.
images:
  - name: stander
    newName: ghcr.io/lvgj-stack/stander
    newTag: 0.0.1-alpha.1
  - name: stander-web
    newName: ghcr.io/lvgj-stack/stander-web
    newTag: 0.0.1-alpha.1
