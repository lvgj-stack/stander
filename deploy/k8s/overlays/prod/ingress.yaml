apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stander
  annotations:
    # The admin console and the agent callbacks share one port; both are plain
    # HTTP behind this Ingress.
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx
  rules:
    - host: stander.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stander
                port:
                  name: http
