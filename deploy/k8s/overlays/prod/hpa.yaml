apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: stander-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    # Only the API scales. stander-worker is a singleton by design and must
    # never be given an HPA.
    name: stander-server
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
