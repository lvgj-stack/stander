# Local development stack: MySQL plus the stander server with its in-process
# worker. Production runs the server and worker as separate workloads — see
# deploy/k8s and docs/deployment.md.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: stander
      MYSQL_DATABASE: stander
    ports:
      - "13306:3306"
    volumes:
      - ../sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1, not localhost: localhost resolves to the unix socket, which
      # answers during MySQL's init phase before TCP is listening — which is
      # what the application actually connects over.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pstander"]
      interval: 5s
      timeout: 3s
      retries: 20

  stander:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # 构建容器不继承宿主机的 Go 配置：`go env` 里的 GOPROXY 写在
        # ~/.config/go/env 里，镜像里那个 golang 容器读不到它。默认值与
        # Dockerfile、scripts/e2e-kind.sh 保持一致，连不到 proxy.golang.org
        # 的网络下从 shell 覆盖：
        #   GOPROXY=https://goproxy.cn,direct docker compose ... up -d --build
        # 走 args 而不是让人每次敲 --build-arg，是因为 `up --build` 不收这个参数。
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      STANDER_DATABASE_ADDR: mysql:3306
      STANDER_DATABASE_USERNAME: root
      STANDER_DATABASE_PASSWORD: stander
      STANDER_DATABASE_DBNAME: stander
      STANDER_ADMIN_JWTSIGNINGKEY: dev-only-not-a-real-key
      STANDER_SERVER_LOGLEVEL: "2"
      # Left unset on purpose: the console is on :8080 and the controller on
      # :8123 of the same host, which is exactly the case the server's own
      # guess (request host + Server.Port) gets right. A real deployment behind
      # a proxy has to set it — see docs/configuration.md.
    command: ["server", "--pprof-addr", ""]
    # stander fails fast when the database is unreachable; restarting is how it
    # recovers, the same way a Kubernetes Pod would.
    restart: unless-stopped
    ports:
      - "8123:8123"
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    environment:
      # nginx reverse-proxies /auth, /user, /role and /stander to
      # the backend, so the app and the API share an origin. That is what keeps
      # the captcha's session cookie working without SameSite=None.
      STANDER_API_UPSTREAM: http://stander:8123
    ports:
      - "8080:8080"
    depends_on:
      - stander

volumes:
  mysql-data:
