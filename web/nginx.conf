server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames change on every build, so they can be cached hard.
    # `expires` emits its own Cache-Control, so setting both here would send two
    # conflicting headers; the explicit one wins because it also carries
    # `immutable`.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The API. Proxying it under the same origin as the app keeps every call
    # free of a CORS preflight, and means no list of trusted origins has to be
    # kept in step with wherever the console happens to be deployed.
    #
    # The app's own routes are /login, /admin/* and /portal/*, none of which
    # collide with these prefixes. The user side is at /portal rather than
    # /user precisely because this rule owns /user.
    location ~ ^/(auth|user|stander)(/|$) {
        proxy_pass ${STANDER_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html itself must never be cached, or a browser keeps loading the
    # previous build's asset names after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: every other path renders the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
