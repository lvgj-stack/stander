server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames change on every build, so they can be cached hard.
    # `expires` emits its own Cache-Control, so setting both here would send two
    # conflicting headers; the explicit one wins because it also carries
    # `immutable`.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The API. Proxying it under the same origin as the app is what lets the
    # captcha's session cookie survive the round trip; a cross-origin setup
    # needs SameSite=None plus CORS credentials to work at all.
    location ~ ^/(auth|user|role|permission|stander)(/|$) {
        proxy_pass ${STANDER_API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html itself must never be cached, or a browser keeps loading the
    # previous build's asset names after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: every other path renders the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
