# Builds and publishes the two container images, then rolls them out.
#
# Triggered by a version tag, or by hand from the Actions tab when a specific
# commit needs to go out.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Which environment to deploy
        type: choice
        options: [prod, dev]
        default: prod
        required: true

concurrency:
  # Never two rollouts at once against the same cluster.
  group: release-${{ github.event.inputs.environment || 'prod' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  meta:
    name: work out the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      owner: ${{ steps.meta.outputs.owner }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Work out the tag
        id: meta
        # Its own job because the three jobs below all need the same answer,
        # and "is this a preview?" in particular must have exactly one place to
        # live: it decides both whether `:latest` moves and whether the GitHub
        # Release is marked as a prerelease. Those two disagreeing is precisely
        # how a preview becomes what an unpinned install picks up.
        #
        # Both images always carry the same tag. Mixing versions between the
        # console and the API it talks to is not a state worth supporting.
        #
        # No checkout: everything here comes out of the ref and the SHA.
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            tag="${GITHUB_REF_NAME#v}"
          else
            tag="${GITHUB_SHA::7}"
          fi
          # Semver's own rule: anything after a hyphen is a prerelease
          # identifier, so v0.1.0-alpha.1 and v0.1.0-beta.1 are previews and
          # v0.1.0 is not. Deliberately the rule rather than a list of known
          # suffixes — adding -rc.1 later then needs no change here. The
          # scheme itself is written down in docs/cicd.md.
          #
          # A manual dispatch has no version tag at all, which is not the
          # stable release either.
          case "${{ github.ref_type }}:$tag" in
            tag:*-*) prerelease=true ;;
            tag:*) prerelease=false ;;
            *) prerelease=true ;;
          esac
          # GHCR rejects an image path with uppercase in it, and the owner name
          # keeps whatever case the account was created with.
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "tag=$tag"
            echo "owner=$owner"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Building ghcr.io/$owner/*:$tag (prerelease=$prerelease)"

  images:
    name: build and push
    runs-on: ubuntu-latest
    needs: meta
    strategy:
      matrix:
        include:
          - image: stander
            context: .
            dockerfile: Dockerfile
          - image: stander-web
            context: ./web
            dockerfile: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # arm64 as well as amd64: forwarding nodes are often cheap ARM VPSes,
          # and the same image runs the server.
          platforms: linux/amd64,linux/arm64
          push: true
          # `:latest` moves only for a stable release. A preview that took it
          # would become what every `docker pull` with no tag gets, and what a
          # compose file pinned to `latest` picks up on its next restart — the
          # opposite of what publishing a preview is supposed to mean. On a
          # preview the expression yields an empty line, which the action's own
          # list parsing drops.
          tags: |
            ${{ env.REGISTRY }}/${{ needs.meta.outputs.owner }}/${{ matrix.image }}:${{ needs.meta.outputs.tag }}
            ${{ needs.meta.outputs.prerelease == 'false' && format('{0}/{1}/{2}:latest', env.REGISTRY, needs.meta.outputs.owner, matrix.image) || '' }}
          build-args: |
            VERSION=${{ needs.meta.outputs.tag }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  binaries:
    name: publish agent binaries
    runs-on: ubuntu-latest
    needs: meta
    # Only a version tag gets a GitHub Release to attach assets to; a manual
    # workflow_dispatch deploy has no release to upload into.
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Make sure there is a Release to attach to
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Pushing a tag does not create a Release. Without this the upload
        # below dies with "release not found" — after both images have already
        # been pushed, leaving a version that exists as containers but has no
        # agent binary, which is what scripts/install.sh downloads.
        #
        # Created here rather than by hand so the prerelease flag comes from
        # the same place the `:latest` decision does. It matters beyond
        # labelling: GitHub's /releases/latest — where the installer looks by
        # default — skips prereleases, so this flag is what keeps a preview
        # from becoming the default install.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; uploading into it."
            exit 0
          fi
          flags=""
          if [ "${{ needs.meta.outputs.prerelease }}" = true ]; then
            flags="--prerelease"
          fi
          # --generate-notes gives it the commit list; a human can edit the
          # body afterwards without the assets having to be re-uploaded.
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $flags

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: Cross-compile the agent binary
        # scripts/install.sh downloads these by exact name; keep the two in
        # step. Static (CGO off) so they run on any glibc/musl VPS.
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w \
                -X github.com/lvgj-stack/stander/cmd.version=${GITHUB_REF_NAME#v} \
                -X github.com/lvgj-stack/stander/cmd.commit=${GITHUB_SHA::7}" \
              -o "dist/stander_linux_${arch}" .
          done
          ( cd dist && sha256sum stander_linux_* > SHA256SUMS )
          cat dist/SHA256SUMS

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --clobber so re-running the workflow on the same tag replaces the
        # assets instead of failing on "already exists".
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/stander_linux_amd64 \
            dist/stander_linux_arm64 \
            dist/SHA256SUMS \
            --clobber

  deploy:
    name: deploy to kubernetes
    runs-on: ubuntu-latest
    needs: [meta, images]
    # A preview tag publishes; it does not deploy. `v0.1.0-beta.1` exists to be
    # installed on purpose by someone who chose it, and rolling it onto prod
    # the moment it is tagged is the opposite of that — it would make every
    # preview a production release with a quieter name.
    #
    # Images and binaries are still built and published, so a preview can be
    # deployed deliberately: run the workflow by hand from the Actions tab and
    # pick an environment. A manual run always deploys, which is the whole
    # point of asking for one.
    if: github.event_name == 'workflow_dispatch' || needs.meta.outputs.prerelease == 'false'
    environment: ${{ github.event.inputs.environment || 'prod' }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure cluster access
        # A kubeconfig scoped to the stander namespace, stored as an
        # environment secret so the prod environment can require a reviewer.
        #
        # The secret arrives through env rather than being interpolated into
        # the script text: an expression expanded inline becomes part of the
        # command, where a stray `set -x` or a shell trace would print it.
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "::error::KUBECONFIG secret is not set for this environment."
            exit 1
          fi
          mkdir -p ~/.kube
          printf '%s' "$KUBECONFIG_B64" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config
          echo "Deploying to: $(kubectl config current-context)"

      - name: Point the overlay at the images just pushed
        working-directory: deploy/k8s/overlays/${{ github.event.inputs.environment || 'prod' }}
        run: |
          registry="${{ env.REGISTRY }}/${{ needs.meta.outputs.owner }}"
          tag="${{ needs.meta.outputs.tag }}"
          # `kustomize edit` is not available here, so the images block is
          # rewritten in place. It is checked afterwards by rendering it.
          python3 - "$registry" "$tag" <<'PY'
          import pathlib, re, sys
          registry, tag = sys.argv[1], sys.argv[2]
          p = pathlib.Path('kustomization.yaml')
          text = p.read_text()
          for name in ('stander-web', 'stander'):
              text = re.sub(
                  rf'(- name: {re.escape(name)}\n)(\s+)(?:newName: \S+\n\s+)?newTag: \S+',
                  rf'\g<1>\g<2>newName: {registry}/{name}\n\g<2>newTag: {tag}',
                  text,
                  count=1,
              )
          p.write_text(text)
          PY
          cat kustomization.yaml

      - name: Render and show what will change
        run: |
          kubectl kustomize deploy/k8s/overlays/${{ github.event.inputs.environment || 'prod' }} \
            | tee /tmp/rendered.yaml | grep -E '^\s+image:'
          kubectl diff -f /tmp/rendered.yaml || true

      - name: Apply
        run: kubectl apply -f /tmp/rendered.yaml

      - name: Wait for the rollout
        # Every workload has to come back healthy. Without this the job goes
        # green while pods are still crash-looping.
        #
        # The namespace is read out of the rendered manifests, not out of the
        # kubeconfig: the overlay is what decides where this goes (`stander`
        # for prod, `stander-dev` for dev), and a kubeconfig with no namespace
        # set would otherwise send the check to the wrong place and pass.
        run: |
          ns=$(grep -m1 '^  namespace: ' /tmp/rendered.yaml | awk '{print $2}')
          [ -n "$ns" ] || { echo "::error::could not determine namespace"; exit 1; }
          echo "namespace=$ns" >> "$GITHUB_ENV"
          echo "Waiting on rollouts in $ns"
          for d in stander-server stander-web stander-worker; do
            echo "::group::$d"
            kubectl -n "$ns" rollout status "deploy/$d" --timeout=300s
            echo "::endgroup::"
          done

      - name: Roll back if the rollout failed
        if: failure()
        run: |
          ns="${namespace:-}"
          if [ -z "$ns" ]; then
            echo "::error::Deploy failed before the namespace was known; nothing rolled back."
            exit 1
          fi
          for d in stander-server stander-web stander-worker; do
            kubectl -n "$ns" rollout undo "deploy/$d" || true
          done
          echo "::error::Rollout failed in $ns; undo issued for all three Deployments."
